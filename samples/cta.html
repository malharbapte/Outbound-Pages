<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTA interaction samples | Outbound RVs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
<style>
  /* Section-only sample at the 2376px artboard width, zoomed to fit.
     Each row is 2376 x 380: label in the left third, the CTA on a light and a dark panel in the other thirds. */
  :root { --poppins: "Poppins", system-ui, sans-serif; --oswald: "Oswald", "Arial Narrow", sans-serif;
          --tyre: #0b0a07; --bone: #f4f1ea; --olive: #8b9b4d; --deep: #6b7a32; --orange: #ee964b;
          --blue: #284b63; --rose: #d5aca9; --rose-deep: #8e6673; --warm-grey: #7a736a;
          --radius: 6px; --ease: cubic-bezier(.65, 0, .35, 1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; }
  body { font-family: var(--poppins); -webkit-font-smoothing: antialiased; color: var(--tyre); }
  h1, h2, p { margin: 0; }
  .page { width: 2376px; zoom: var(--zoom, 1); overflow: clip; padding: 110px 0 160px; }
  .top { padding: 0 395px 40px; }
  .top h1 { font: 700 84px/1 var(--oswald); }
  .top p { margin-top: 16px; font: 300 32px/1.4 var(--poppins); color: var(--warm-grey); }
  .group { padding: 90px 395px 30px; font: 700 56px/1 var(--oswald); color: var(--deep); }
  .group small { display: block; margin-top: 12px; font: 300 28px/1.4 var(--poppins); color: var(--warm-grey); }

  .row { position: relative; display: grid; grid-template-columns: repeat(3, 792px); height: 380px; }
  .row + .row { margin-top: 20px; }
  .meta { padding: 0 60px 0 395px; display: flex; flex-direction: column; justify-content: center; }
  .meta h2 { font: 700 44px/1.05 var(--oswald); }
  .meta h2 span { color: var(--orange); margin-right: 14px; }
  .meta p { margin-top: 14px; font: 300 25px/1.4 var(--poppins); color: var(--warm-grey); }
  .panel { display: grid; place-items: center; }
  .panel.light { background: var(--bone); }
  .panel.dark { background: var(--tyre); }

  .cta { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 18px; width: 507px; height: 93px;
         border: 0; border-radius: var(--radius); background: var(--olive); color: var(--bone); font: 600 34px/1 var(--poppins);
         text-decoration: none; cursor: pointer; overflow: hidden; isolation: isolate; -webkit-tap-highlight-color: transparent;
         transition: transform .18s ease; }
  .cta:active { transform: scale(.98); }
  .cta:focus-visible { outline: 4px solid var(--orange); outline-offset: 5px; }
  .chev { width: 16px; height: 16px; border-top: 4px solid currentColor; border-right: 4px solid currentColor; transform: rotate(45deg); border-radius: 1px; }

  /* ===== A. Chevron Wipe refinements ===== */
  /* The wipe is a child element so its motion can be driven smoothly in both directions. */
  .wipe .fill { position: absolute; top: 0; bottom: 0; left: -64px; width: calc(100% + 64px); z-index: -1; background: var(--wipe);
                clip-path: polygon(0 0, calc(100% - 64px) 0, 100% 50%, calc(100% - 64px) 100%, 0 100%);
                transform: translateX(-100%); pointer-events: none; }
  .wipe .label { position: relative; display: inline-flex; align-items: center; gap: 18px; transition: color .3s ease; }
  .light .tb { --wipe: var(--tyre); --on: var(--bone); }
  .dark .tb { --wipe: var(--bone); --on: var(--tyre); }
  .light .rd { --wipe: var(--rose-deep); --on: var(--bone); }
  .dark .rd { --wipe: var(--rose); --on: var(--tyre); }
  .wipe.covered .label { color: var(--on); }
  .rd .chev { width: 0; margin-left: -18px; opacity: 0; transition: width .4s var(--ease), margin .4s var(--ease), opacity .3s ease; }
  .rd.covered .chev { width: 16px; margin-left: 0; opacity: 1; }

  /* ===== B. Gentle hover confirmations (on the current Olive button) ===== */
  .g1 svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .g1 rect { fill: none; stroke: var(--bone); stroke-width: 2.5; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .9s var(--ease); opacity: .9; }
  .g1:hover rect { stroke-dashoffset: 0; }

  .g2 { overflow: visible; }
  .g2::after { content: ""; position: absolute; inset: 0; border-radius: var(--radius); pointer-events: none; }
  .g2:hover::after { animation: ring 1s var(--ease); }
  @keyframes ring { from { box-shadow: 0 0 0 0 rgba(139, 155, 77, .55); } to { box-shadow: 0 0 0 16px rgba(139, 155, 77, 0); } }

  .g3 { transition: background-color .45s ease, letter-spacing .45s var(--ease), transform .18s ease; }
  .g3:hover { background: var(--deep); letter-spacing: .06em; }

  .g4 { transition: transform .5s var(--ease), box-shadow .5s var(--ease); }
  .g4:hover { transform: scale(1.02); box-shadow: 0 10px 24px -12px rgba(11, 10, 7, .5); }
  .dark .g4:hover { box-shadow: 0 10px 24px -12px rgba(244, 241, 234, .25); }
  .g4:active { transform: scale(.99); }

  .g5 svg { width: 22px; height: 30px; margin-left: -4px; overflow: visible; }
  .g5 path { fill: none; stroke: currentColor; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .5s var(--ease); }
  .g5 .label { transition: transform .45s var(--ease); }
  .g5:hover path { stroke-dashoffset: 0; }
  .g5:hover .label { transform: translateX(-6px); }

  /* Thirds overlay */
  .grid { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s; z-index: 9;
    background:
      linear-gradient(to right, transparent calc(33.333% - 1.5px), rgba(238,150,75,.9) calc(33.333% - 1.5px), rgba(238,150,75,.9) calc(33.333% + 1.5px), transparent calc(33.333% + 1.5px),
                                transparent calc(66.666% - 1.5px), rgba(238,150,75,.9) calc(66.666% - 1.5px), rgba(238,150,75,.9) calc(66.666% + 1.5px), transparent calc(66.666% + 1.5px)),
      linear-gradient(to bottom, transparent calc(33.333% - 1.5px), rgba(238,150,75,.9) calc(33.333% - 1.5px), rgba(238,150,75,.9) calc(33.333% + 1.5px), transparent calc(33.333% + 1.5px),
                                 transparent calc(66.666% - 1.5px), rgba(238,150,75,.9) calc(66.666% - 1.5px), rgba(238,150,75,.9) calc(66.666% + 1.5px), transparent calc(66.666% + 1.5px)); }
  body.show-grid .grid { opacity: 1; }
  .grid-toggle { position: fixed; right: 24px; bottom: 24px; z-index: 50; font: 600 14px/1 var(--poppins); letter-spacing: .06em; text-transform: uppercase;
                 background: var(--tyre); color: var(--bone); border: 0; padding: 14px 18px; cursor: pointer; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) { .cta, .cta * { transition-duration: .01s !important; animation: none !important; } }
</style>
</head>
<body>
<button class="grid-toggle" type="button" onclick="document.body.classList.toggle('show-grid')">Show thirds grid</button>
<main class="page" id="page">
  <header class="top">
    <h1>CTA INTERACTIONS</h1>
    <p>Round four. Group A refines the Chevron Wipe based on your feedback. Group B shows gentle hover confirmations for comparison. All buttons have 6px corners and press in slightly on click.</p>
  </header>
</main>

<script>
  const page = document.getElementById('page');
  const fit = () => page.style.setProperty('--zoom', document.documentElement.clientWidth / 2376);
  fit(); addEventListener('resize', fit);

  const GROUPS = [
    ['A. CHEVRON WIPE', 'The Tyre/Bone colours you liked, a smoother Pass Through, and Rose Deep that turns light Rose on dark backgrounds.', [
      ['Tyre / Bone', 'Black wipe on light backgrounds. A Bone White wipe with a black label on dark ones. The wipe reverses out when the cursor leaves.', 'wipe tb', 'reverse', l => l],
      ['Tyre / Bone — Pass Through', 'Same colours, but on leaving the wipe continues out to the right. It always picks up from its current position, so quick in-and-out never jumps.', 'wipe tb', 'pass', l => l],
      ['Rose Deep + Chevron', 'Rose Deep on light backgrounds and light Rose with a black label on dark ones. A chevron slides in after the label.', 'wipe rd', 'reverse', l => `${l}<span class="chev"></span>`],
      ['Rose + Chevron — Pass Through', 'The Rose version with the smoother pass-through motion.', 'wipe rd', 'pass', l => `${l}<span class="chev"></span>`],
    ]],
    ['B. GENTLE HOVER CONFIRMATIONS', 'Quiet signals that the button is ready to click. Each is shown on its own on the current Olive button; any of them can be added to the chosen wipe.', [
      ['Border Trace', 'A thin Bone line traces around the button’s edge once.', 'g1', null, l => `<svg aria-hidden="true"><rect x="1.5" y="1.5" rx="5" pathLength="1"/></svg>${l}`],
      ['Soft Ring', 'A single soft Olive ring expands out from the button and fades away.', 'g2', null, l => l],
      ['Tracking Ease', 'The label’s letters spread very slightly while the button deepens to Deep Olive.', 'g3', null, l => l],
      ['Breathe', 'The button grows by just 2% with a faint shadow, then settles back on click.', 'g4', null, l => l],
      ['Chevron Draw', 'A chevron draws itself in after the label as the label shifts over to make room.', 'g5', null,
       l => `<span class="label">${l}</span><svg viewBox="0 0 22 30" aria-hidden="true"><path d="M4 4 16 15 4 26" pathLength="1"/></svg>`],
    ]],
  ];

  GROUPS.forEach(([title, sub, rows]) => {
    const g = document.createElement('p');
    g.className = 'group';
    g.innerHTML = `${title}<small>${sub}</small>`;
    page.append(g);
    rows.forEach(([name, desc, cls, mode, inner], i) => {
      const row = document.createElement('section');
      row.className = 'row';
      const btn = text => mode
        ? `<a href="#" class="cta ${cls}" data-mode="${mode}" onclick="return false"><span class="fill"></span><span class="label">${inner(text)}</span></a>`
        : `<a href="#" class="cta ${cls}" onclick="return false">${inner(text)}</a>`;
      row.innerHTML = `
        <div class="meta"><h2><span>${title[0]}${i + 1}</span>${name}</h2><p>${desc}</p></div>
        <div class="panel light">${btn('Build your caravan')}</div>
        <div class="panel dark">${btn('Let us know')}</div>
        <span class="grid" aria-hidden="true"></span>`;
      page.append(row);
    });
  });

  // Border Trace rect sized to the button box.
  document.querySelectorAll('.g1 rect').forEach(r => { r.setAttribute('width', 504); r.setAttribute('height', 90); });

  // Chevron wipe motion (Web Animations API): always continues from the current position, so quick
  // in-and-out never jumps. The label colour flips once the wipe has covered the middle.
  const DUR = 600, EASE = 'cubic-bezier(.65, 0, .35, 1)', COVER = 64 / 571;
  document.querySelectorAll('.wipe').forEach(btn => {
    const fill = btn.querySelector('.fill');
    let anim = null;
    const pos = () => new DOMMatrixReadOnly(getComputedStyle(fill).transform).m41 / fill.offsetWidth;
    const go = (from, to, onDone) => {
      anim?.cancel();
      fill.style.transform = `translateX(${from * 100}%)`;
      anim = fill.animate([{ transform: `translateX(${from * 100}%)` }, { transform: `translateX(${to * 100}%)` }],
                          { duration: Math.max(200, DUR * Math.min(1, Math.abs(to - from))), easing: EASE, fill: 'forwards' });
      anim.onfinish = () => { fill.style.transform = `translateX(${to * 100}%)`; onDone?.(); };
    };
    btn.addEventListener('mouseenter', () => {
      let from = pos();
      if (from > COVER + .01) from = -1;   // was mid pass-through exit: start again from the left
      go(from, COVER);
      setTimeout(() => btn.matches(':hover') && btn.classList.add('covered'), 220);
    });
    btn.addEventListener('mouseleave', () => {
      btn.classList.remove('covered');
      if (btn.dataset.mode === 'pass') go(pos(), 1.12, () => { anim?.cancel(); fill.style.transform = 'translateX(-100%)'; });
      else go(pos(), -1);
    });
  });
</script>
</body>
</html>
