<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAQ: layout samples</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../site.css">
<style>
  body { background: #fff; }
  .label { width: var(--content); margin: 5rem auto 0; font: 600 .75rem/1.4 var(--poppins); letter-spacing: .14em; text-transform: uppercase; color: var(--warm-grey); }
  .label b { color: var(--tyre); }
  .label span { display: block; margin-top: .35rem; text-transform: none; letter-spacing: 0; font-weight: 400; font-size: .85rem; }
  .sample { position: relative; padding: 2.4rem 0 3.4rem; }
  .sample .container { position: relative; z-index: 1; }
  .q { width: 100%; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; font: inherit; color: inherit; }
  .ans-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s var(--ease); }
  .item.on .ans-wrap { grid-template-rows: 1fr; }
  .ans { overflow: hidden; }

  /* ---- A · Current, in Blue ---- */
  .a .list { margin-top: 2.4rem; }
  .a .item + .item { margin-top: 1.21rem; }
  .a .q { display: flex; align-items: center; gap: .8rem; font: 400 1.21rem/1.59rem var(--poppins); color: var(--rose-deep); transition: color .25s ease; }
  .a .dmd { flex: none; width: .7rem; height: .7rem; border-radius: 2px; background: var(--rose-deep); rotate: 0deg; transition: rotate .5s var(--ease), background-color .25s ease; }
  .a .item.on .q { color: var(--blue); }
  .a .item.on .dmd { rotate: 45deg; background: var(--blue); }
  .a .ans > div { background: var(--blue); color: var(--bone); font: 400 1.21rem/1.59rem var(--poppins); }
  .a .item.on .ans > div { min-height: 10.2rem; padding: .49rem 1.29rem; margin-top: .19rem; }

  /* ---- B · Two columns: the ask on the left, the list on the right ---- */
  .b .cols { margin-top: 2.4rem; display: grid; grid-template-columns: 19.13rem 1fr; column-gap: 3rem; align-items: start; }
  .b .aside p { font: 400 1.05rem/1.45 var(--poppins); color: var(--warm-grey); text-wrap: pretty; }
  .b .aside .btn { margin-top: 1.4rem; }
  .b .item { border-top: 1px solid rgba(11, 10, 7, .14); }
  .b .item:last-child { border-bottom: 1px solid rgba(11, 10, 7, .14); }
  .b .q { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.1rem 0; font: 500 1.21rem/1.4 var(--poppins); color: var(--tyre); transition: color .25s ease; }
  .b .q:hover { color: var(--blue); }
  .b .mark { flex: none; width: .8rem; height: .8rem; border-radius: 2px; background: none; box-shadow: inset 0 0 0 2px var(--blue); rotate: 0deg;
             transition: rotate .5s var(--ease), background-color .3s ease; }
  .b .item.on .q { color: var(--blue); }
  .b .item.on .mark { rotate: 45deg; background: var(--blue); }
  .b .ans > div { padding-bottom: 1.4rem; max-width: 34rem; font: 400 1.05rem/1.55 var(--poppins); color: var(--warm-grey); text-wrap: pretty; }

  /* ---- C · The open question fills with Blue ---- */
  .c .list { margin-top: 2.4rem; border: 2px solid rgba(11, 10, 7, .14); }
  .c .item + .item { border-top: 2px solid rgba(11, 10, 7, .14); }
  .c .item { transition: background-color .4s ease; }
  .c .item.on { background: var(--blue); }
  .c .q { display: flex; align-items: center; gap: 1rem; padding: 1.2rem 1.4rem; font: 500 1.21rem/1.4 var(--poppins); color: var(--tyre); transition: color .3s ease; }
  .c .q:hover { color: var(--blue); }
  .c .item.on .q { color: #fff; }
  .c .n { font: 600 .8rem/1 var(--poppins); letter-spacing: .1em; color: var(--warm-grey); transition: color .3s ease; }
  .c .item.on .n { color: var(--rose); }
  .c .ans > div { padding: 0 1.4rem 1.4rem 4.1rem; max-width: 46rem; font: 400 1.05rem/1.55 var(--poppins); color: var(--bone); text-wrap: pretty; }

  /* ---- D · Blue rail: a quiet list with a blue rule marking the open answer ---- */
  .d .list { margin-top: 2.4rem; }
  .d .item { padding-left: 1.6rem; border-left: 3px solid rgba(40, 75, 99, .18); transition: border-color .35s ease; }
  .d .item + .item { margin-top: .4rem; }
  .d .item.on { border-color: var(--blue); }
  .d .q { padding: .9rem 0; font: 500 1.36rem/1.35 var(--poppins); color: var(--tyre); transition: color .25s ease; }
  .d .q:hover, .d .item.on .q { color: var(--blue); }
  .d .ans > div { padding-bottom: 1.2rem; max-width: 40rem; font: 400 1.05rem/1.6 var(--poppins); color: var(--warm-grey); text-wrap: pretty; }
  .d .chev { position: absolute; }
</style>
</head>
<body>
<button class="grid-toggle" type="button" onclick="document.body.classList.toggle('show-grid')">Show thirds grid</button>
<div id="page"></div>

<script>
  const QS = [
    ['How do I tow?', 'Answer : towing weights, licence classes and what to check before you set off. This copy is a stand-in until the real answers arrive.'],
    ['How can I claim warranty?', 'Answer : who to contact, what to send, and how long a claim usually takes. Stand-in copy.'],
    ['What components are not covered under warranty?', 'Answer : the short list of wear items and anything fitted after handover. Stand-in copy.'],
  ];
  const LAYOUTS = [
    ['a', 'A · Current, in Blue', 'The layout that is on the page now, with Olive swapped for Blue. The answer panel is a solid blue block.'],
    ['b', 'B · Two columns', 'The heading and an invitation to ask sit on the left third; the questions run down the right two-thirds as a quiet ruled list. Answers are plain text, which suits long ones.'],
    ['c', 'C · Filled row', 'Numbered rows in one bordered block. The open row fills with Blue and its answer sits inside it.'],
    ['d', 'D · Blue rail', 'No boxes: a pale blue rule runs down the list, and the open question’s rule turns solid Blue. The lightest of the four.'],
  ];
  document.getElementById('page').innerHTML = LAYOUTS.map(([k, name, note]) => {
    const items = QS.map(([q, a], i) => `
        <div class="item${i === 0 ? ' on' : ''}">
          <button class="q" type="button" aria-expanded="${i === 0}">
            ${k === 'c' ? `<span class="n">0${i + 1}</span>` : ''}${k === 'a' ? '<span class="dmd"></span>' : ''}<span>${q}</span>${k === 'b' ? '<span class="mark"></span>' : ''}
          </button>
          <div class="ans-wrap"><div class="ans"><div>${a}</div></div></div>
        </div>`).join('');
    const body = k === 'b'
      ? `<div class="cols">
           <div class="aside">
             <h2 class="section-title" style="font-size:2.6rem">FAQ’S</h2>
             <p>Can’t find what you are after? Our team answers questions every day and is happy to&nbsp;help.</p>
             <a class="btn" href="#">Ask us&nbsp;anything</a>
           </div>
           <div class="list">${items}</div>
         </div>`
      : `<h2 class="section-title" style="font-size:2.6rem">FAQ’S</h2><div class="list">${items}</div>`;
    return `<p class="label"><b>${name}</b><span>${note}</span></p>
      <section class="sample ${k}"><div class="container">${body}</div><span class="thirds" aria-hidden="true"></span></section>`;
  }).join('') + '<div style="height:20vh"></div>';

  document.querySelectorAll('.list').forEach(list => {
    const items = [...list.querySelectorAll('.item')];
    items.forEach(item => item.querySelector('.q').addEventListener('click', () => {
      const opening = !item.classList.contains('on');
      items.forEach(other => {
        const on = other === item && opening;
        other.classList.toggle('on', on);
        other.querySelector('.q').setAttribute('aria-expanded', on);
      });
    }));
  });
</script>
</body>
</html>
