<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outbound RVs | Exclusive Victorian Dealership of Wonderland RV</title>
<meta name="description" content="Outbound RVs is the Victorian dealership of Wonderland RV caravans. Visit us at 58B Lara Way, Campbellfield VIC.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet">
<style>
  /* Desktop build. The page is authored at the 2376px artboard width and zoomed to fit the window. */
  :root {
    --poppins: "Poppins", system-ui, sans-serif;
    --oswald: "Oswald", "Arial Narrow", sans-serif;
    --black: #0b0a07; --bone: #f4f1ea; --green: #8b9b4d; --olive: #6b7a32;
    --grey: #7a736a; --mauve: #8e6673; --pink: #d5aca9; --blue: #284b63; --silver: #bcbec0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; }
  body { overflow-x: hidden; font-family: var(--poppins); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  .page { width: 2376px; zoom: var(--zoom, 1); overflow: clip; }
  .artboard { position: relative; width: 2376px; }
  .sec { position: relative; display: block; width: 2376px; margin: 0; }
  .deco { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
  .shapes { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
  .t { position: absolute; margin: 0; white-space: nowrap; z-index: 3; font-kerning: normal; }
  .sec > div, .sec > img, .sec > a, .sec > form, .sec > input, .sec > button { z-index: 1; }
  .z3 { z-index: 3; }
  .nopoint { pointer-events: none; }

  /* Nav */
  .nav { z-index: 5; }
  .navlink { transition: color .2s; }
  .navlink:hover { color: var(--green) !important; }
  .logo { z-index: 3; }

  /* Buttons */
  .btn { display: block; background: var(--green); color: var(--bone); font: 600 36px/43.2px var(--poppins);
         text-align: center; border: 0; cursor: pointer; transition: background .2s; }
  .btn:hover { background: var(--olive); }

  /* Exclusive dealership */
  .exclusive .van { z-index: 2; }

  /* Range */
  .range-card { position: absolute; overflow: hidden; display: block; z-index: 1; }
  .range-card img { position: absolute; max-width: none; transition: transform .6s ease; }
  .range-card:hover img { transform: scale(1.04); }
  .shadow-down, .shadow-up { opacity: .4; mix-blend-mode: multiply; z-index: 2 !important; pointer-events: none; }
  .shadow-down { background: linear-gradient(#231f20 3%, #fff); }
  .shadow-up { background: linear-gradient(#fff, #231f20 97%); }

  /* Drive away */
  .search, .filter { position: absolute; width: 504.68px; height: 74.99px; font: 300 21px var(--poppins); padding: 0 23.7px; border-radius: 0; }
  .search { background: #fff; border: .25px solid var(--black); color: var(--black); outline: none; }
  .search::placeholder { color: #a7a9ac; }
  .filter { width: 503.69px; background: #000; color: #e6e7e8; border: 0; text-align: left; cursor: pointer; }
  .view-toggle { position: absolute; display: flex; gap: 24.8px; }
  .view-toggle button { width: 75.84px; height: 74.99px; padding: 0; background: #fff; border: .25px solid var(--black); border-radius: 2.55px; cursor: pointer; overflow: hidden; }
  .view-toggle button.on { outline: 7px solid var(--mauve); outline-offset: -3.5px; border-color: transparent; }
  .view-toggle svg { display: block; width: 100%; height: 100%; }
  .view-toggle button:focus-visible:not(.on) { outline: 3px solid var(--olive); }

  /* Stock panel (grey band). Sliding view keeps the artboard size; the other views grow the section. */
  .stock-panel { position: relative; z-index: 1; margin-left: 1.85px; width: 2371.79px; background: var(--bone); }
  .stock-panel .shadow-down { position: absolute; left: -2.24px; top: -.21px; width: 2376px; height: 37.79px; }
  .stock-panel .shadow-up { position: absolute; left: -1.85px; bottom: 0; width: 2376px; height: 37.79px; z-index: 2; }
  .stock-viewport { position: relative; z-index: 1; }
  .stock-track { display: flex; gap: 36.59px; }
  /* Stock card — landscape 4:3 on a thirds grid (825.69 x 619.27: columns every 275.23, rows every 206.42).
     The whole card links to the van page. Other views reuse the same card scaled with zoom. */
  .stock-card { position: relative; flex: none; width: 825.69px; height: 619.27px; display: grid; grid-template-columns: 550.46px 275.23px;
                background: var(--black); color: var(--bone); overflow: hidden; transition: transform .3s ease, box-shadow .3s ease; }
  .stock-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(11, 10, 7, .25); }
  .stock-card:focus-visible { outline: 5px solid var(--green); outline-offset: 4px; }

  .stock-photo { position: relative; overflow: hidden; }
  .stock-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .6s ease; user-select: none; -webkit-user-drag: none; }
  .stock-card:hover .stock-photo img { transform: scale(1.05); }
  .stock-photo::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 55%; background: linear-gradient(to bottom, rgba(11, 10, 7, 0), rgba(11, 10, 7, .88)); }
  .stock-title { position: absolute; left: 34px; right: 24px; top: 412.85px; bottom: 0; z-index: 1; display: flex; flex-direction: column; justify-content: center; }
  .stock-layout { margin: 0; display: flex; align-items: center; gap: 12px; font: 600 18px/1 var(--poppins); letter-spacing: .14em; text-transform: uppercase; color: var(--bone); }
  .stock-layout::before { content: ""; width: 12px; height: 12px; background: var(--green); transform: rotate(45deg); }
  .stock-name { margin: 12px 0 0; font: 700 80px/1 var(--oswald); letter-spacing: .01em; color: #fff; }
  /* Same notched orange tag as "Full Composite" in the range section, mirrored to sit on the left. */
  .stock-badge { position: absolute; left: 0; top: 26px; z-index: 2; background: #ee964b; color: #fff; font: 400 24px/1 var(--poppins);
                 padding: 10px 38px 10px 22px; clip-path: polygon(0 0, 100% 0, calc(100% - 20px) 50%, 100% 100%, 0 100%); }

  .stock-rail { margin: 0; display: grid; grid-template-rows: repeat(3, 206.42px); }
  .stock-rail .row { padding: 0 24px 0 30px; display: flex; flex-direction: column; justify-content: center; }
  .stock-rail .row + .row { border-top: 1px solid rgba(244, 241, 234, .16); }
  .stock-rail dt { font: 400 14px/1 var(--poppins); letter-spacing: .12em; text-transform: uppercase; color: var(--silver); }
  .stock-rail dd { margin: 10px 0 0; font-family: var(--oswald); font-weight: 500; line-height: 1; white-space: nowrap; color: var(--bone); }
  .stock-rail dd small { margin-left: 6px; font: 500 .3em/1 var(--poppins); letter-spacing: .04em; color: var(--silver); }
  .stock-rail .r1 { background: rgba(139, 155, 77, .12); }
  .stock-rail .r1 dt { font-size: 16px; font-weight: 600; color: var(--green); }
  .stock-rail .r1 dd, .stock-rail .r2 dd { font-size: 66px; }
  .stock-rail .r3 { flex-direction: row; align-items: center; }
  .stock-rail .r3 > div { flex: 1; }
  .stock-rail .length { padding-left: 22px; border-left: 1px solid rgba(244, 241, 234, .16); }
  .stock-rail .sleeps dd { font-size: 38px; color: #d9d5cc; }
  .stock-rail .length dd { font-size: 30px; color: var(--silver); }
  .stock-rail .r3 dt { font-size: 13px; }

  /* View 1 — sliding cards */
  .stock-panel[data-view="slide"] { height: 832.44px; }
  .stock-panel[data-view="slide"] .stock-viewport { overflow: hidden; margin-left: -1.85px; width: 2376px; padding: 106.57px 0 0 93.91px; cursor: grab; touch-action: pan-y; }
  .stock-panel[data-view="slide"] .stock-viewport.dragging { cursor: grabbing; }
  .stock-panel[data-view="slide"] .stock-track { will-change: transform; }

  /* Progress line sits on the bottom edge of the grey band. */
  .stock-progress { position: absolute; left: -1.85px; bottom: 0; width: 2376px; height: 18px; background: #d1d3d4; overflow: hidden; z-index: 3; }
  .stock-progress span { display: block; height: 100%; background: var(--olive); transform-origin: left center; transform: scaleX(0); }
  .stock-panel:not([data-view="slide"]) .stock-progress { display: none; }
  .stock-panel:not([data-view="slide"]) .clone { display: none; }

  /* View 2 — two columns (card scaled to fill half the content width) */
  .stock-panel[data-view="cols"] { padding: 106.57px 92.06px 143px; }
  .stock-panel[data-view="cols"] .stock-track { display: grid; grid-template-columns: repeat(2, max-content); justify-content: space-between; row-gap: 60px; }
  .stock-panel[data-view="cols"] .stock-card { zoom: 1.30263; }

  /* View 3 — grid, three across */
  .stock-panel[data-view="grid"] { padding: 106.57px 92.06px 143px; }
  .stock-panel[data-view="grid"] .stock-track { display: grid; grid-template-columns: repeat(3, max-content); justify-content: space-between; row-gap: 36.59px; }
  .stock-panel[data-view="grid"] .stock-card { zoom: .85363; }


  /* Ownership journey — locked "static scroll" stage (see samples/ownership.html) */
  html { scrollbar-gutter: stable; }
  html.scroll-locked { overflow: hidden; } /* stops any in-flight scroll while the journey is locked */
  /* The wrapper is white edge to edge and the stage clips to its box, so nothing outside the box shows,
     even when the stage is scaled down to fit a short window. */
  .journey-scroll { position: relative; z-index: 2; background: #fff; }
  .journey-stage { position: absolute; left: 0; top: 0; width: 2376px; height: 100%; overflow: hidden; transition: opacity .5s ease; --s: 1; --tx: 0px; --ty: 0px; }
  .journey-stage.leaving { opacity: 0; }
  .journey-stage .layer { position: absolute; left: 0; top: 0; width: 2376px; height: 100%; transition: opacity .7s ease; }
  .journey-stage, .journey-stage * { cursor: none; } /* no cursor over the journey and we care */
  .journey-layer { background: var(--black); }
  .care-layer { background: #fff; }
  .layer-content, .layer-edge { position: absolute; top: 0; width: 2376px; height: 1564.77px; }
  .layer-content { left: 0; transform-origin: 0 0; transform: translate(var(--tx), var(--ty)) scale(var(--s)); }
  .layer-edge { pointer-events: none; z-index: 4; }
  .layer-edge.left { left: 0; transform-origin: 0 0; transform: translateY(var(--ty)) scale(var(--s)); }
  .layer-edge.right { right: 0; transform-origin: 100% 0; transform: translateY(var(--ty)) scale(var(--s)); }
  .care-layer { opacity: 0; pointer-events: none; }
  .journey-stage.care .journey-layer { opacity: 0; }
  .journey-stage.care .care-layer { opacity: 1; transition-delay: .6s; pointer-events: auto; }
  .journey-svg .track { fill: none; stroke: rgba(244, 241, 234, .28); stroke-width: 4; }
  .journey-svg .fill { fill: none; stroke: #fff; stroke-width: 4; transition: stroke-dashoffset .8s cubic-bezier(.65, 0, .35, 1); }
  .journey-svg .step-diamond { fill: var(--bone); transition: fill .45s ease, opacity .45s ease; }
  .journey-svg .step-diamond.done { fill: var(--green); }
  .journey-stage[data-phase="custom"] .d-stock, .journey-stage[data-phase="custom"] .track-stock { opacity: .35; }
  .path-label { transition: opacity .45s ease; }
  .journey-stage[data-phase="custom"] .path-label[data-path="stock"],
  .journey-stage[data-phase="stock"] .path-label[data-path="custom"] { opacity: .4; }
  .step-panel { position: absolute; z-index: 4; display: flex; gap: 34.08px; opacity: 0; transition: opacity .45s ease; pointer-events: none; }
  .step-panel.on { opacity: 1; transition-delay: .35s; }
  .step-num { flex: none; width: 71.22px; height: 71.22px; background: var(--pink); color: var(--black); display: grid; place-items: center; font: 700 40px/1 var(--oswald); }
  .step-text { width: 920px; padding-top: 7.77px; }
  .step-text h3 { margin: 0; font: 600 48px/57.6px var(--poppins); color: var(--bone); }
  .step-text p { margin: 19.56px 0 0; font: 300 36px/43.2px var(--poppins); color: var(--bone); }
  #after-journey { transition: opacity 1.2s ease, transform 1.2s cubic-bezier(.2, .7, .2, 1); }
  #after-journey.hidden { opacity: 0; transform: translateY(40px); transition: none; }
  #after-journey.fading-out { opacity: 0; transition: opacity .5s ease; }

  .stock-track.swap { animation: stock-swap .45s ease; }
  .stock-panel[data-view="slide"] .stock-track.swap { animation-name: stock-fade; }
  @keyframes stock-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes stock-swap { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }

  /* Beyond sale — expanding panels */
  .bs-items { position: absolute; z-index: 2; width: 1586px; height: 580px; display: flex; gap: 20px; --ease: cubic-bezier(.65, 0, .35, 1); }
  .bs-item { position: relative; flex: 1 1 0; min-width: 0; background: var(--bone); padding: 52px; overflow: hidden; cursor: default;
             transition: flex-grow .75s var(--ease), background-color .5s ease, box-shadow .5s ease; }
  .bs-item.on { flex-grow: 4; background: #fff; box-shadow: inset 0 0 0 3px var(--olive); }
  .bs-icon { display: block; width: 96px; height: 96px; fill: none; stroke: var(--olive); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
  .bs-item h3 { position: absolute; left: 52px; bottom: 52px; margin: 0; font: 700 48px/1.15 var(--poppins); color: #000; white-space: nowrap;
                transform-origin: 0 100%; transform: rotate(-90deg) translate(0, 100%);
                transition: transform .65s var(--ease), bottom .65s var(--ease), color .45s ease; }
  .bs-item.on h3 { transform: none; bottom: 318px; color: var(--olive); }
  .bs-desc { position: absolute; left: 52px; top: 290px; width: 860px; margin: 0; font: 400 32px/42px var(--poppins); color: var(--black);
             opacity: 0; transform: translateY(16px); transition: opacity .3s ease, transform .3s ease; }
  .bs-item.on .bs-desc { opacity: 1; transform: none; transition: opacity .5s ease .4s, transform .6s var(--ease) .4s; }

  /* Stories */
  .tile { box-sizing: border-box; }
  .tile-white { background: #fff; border: 3px solid var(--black); }
  .tile-green { background: var(--green); border: 1px solid var(--black); }
  .stories .tile { z-index: 1; }

  /* Contact */
  .contact-form { position: absolute; width: 1043.86px; z-index: 3; }
  .contact-form .row { display: flex; gap: 35.12px; }
  .contact-form input.line, .contact-form select.boxed { width: 504.17px; font: 300 24px var(--poppins); color: var(--black); }
  .contact-form input.line { height: 68.3px; padding: 16px 12.6px 0; border: 0; border-bottom: 3px solid var(--grey); background: transparent; outline: none; border-radius: 0; }
  .contact-form input.line:focus { border-bottom-color: var(--green); }
  .contact-form ::placeholder { color: var(--grey); opacity: 1; }
  .contact-form .row:nth-child(2) { margin-top: 26.82px; }
  .contact-form .row:nth-child(3) { margin-top: 26.63px; align-items: flex-end; }
  .contact-form select.boxed { height: 67.21px; padding: 0 12.6px; border: 3px solid var(--grey); background: transparent; appearance: none; color: var(--grey); border-radius: 0; margin-left: -1.5px; width: 507.17px; }
  .contact-form select.boxed:valid { color: var(--black); }
  .contact-form .row:nth-child(3) input.line { height: 67.21px; margin-left: -1.5px; }
  .tabs { margin: 57.18px 0 0 -1.64px; padding: 6.19px 5.99px; border: 3px solid var(--grey); width: 1046.72px; height: 116.25px; display: flex; gap: 6.86px; min-inline-size: 0; }
  .tabs label { flex: none; width: 251.53px; height: 97.57px; position: relative; cursor: pointer; }
  .tabs input { position: absolute; opacity: 0; }
  .tabs span { display: flex; align-items: center; justify-content: center; text-align: center; height: 100%; border: 1px solid var(--grey);
               font: 500 24px/28.8px var(--poppins); color: var(--grey); transition: background .2s, color .2s; }
  .tabs input:checked + span { background: var(--green); border-color: var(--green); color: var(--bone); font-weight: 700; }
  .contact-form textarea { display: block; margin: 32.38px 0 0 -1.5px; width: 1046.72px; height: 166.2px; border: 3px solid var(--grey); padding: 12px 11.1px;
                           font: 300 24px var(--poppins); color: var(--black); resize: none; outline: none; background: transparent; border-radius: 0; }
  .consent { display: flex; gap: 8.35px; margin: 23.32px 0 0 -1.5px; font: 300 24px/28.8px var(--poppins); color: var(--grey); cursor: pointer; }
  .consent input { appearance: none; width: 31.04px; height: 31.04px; margin: 0; border: 3px solid var(--grey); flex: none; cursor: pointer; }
  .consent input:checked { background: var(--green); }
  .consent span { margin-top: -1.5px; }
  .submit { width: 504.91px; height: 93.15px; margin: 38.59px 0 0 .49px; padding-top: 22px; }
  .social { border: 3px solid var(--grey); z-index: 1; display: block; }
  .social-f { background: var(--bone); z-index: 2 !important; }
  .mini-icon { border: 3px solid var(--grey); }
  .mini-f { background: var(--bone); z-index: 2 !important; }

  /* Instagram */
  .ig-track { position: absolute; display: flex; gap: 5.43px; }
  .ig-tile { width: 420.26px; height: 420.26px; background: #fff; border: 3px solid var(--black); flex: none; }

  /* FAQ */
  .faq-list { position: absolute; width: 1584.23px; z-index: 3; }
  .faq-list details { font: 400 32px/42px var(--poppins); color: var(--mauve); }
  .faq-list details + details { margin-top: 32px; }
  .faq-list summary { list-style: none; cursor: pointer; }
  .faq-list summary::-webkit-details-marker { display: none; }
  .faq-list .answer { margin-top: 5px; height: 269.13px; background: var(--green); color: var(--bone); padding: 13px 34px; }
  .footer .t a:hover, .contact .t[href]:hover { text-decoration: underline; }
</style>
</head>
<body>
<main class="page" id="page">
{{ARTBOARD_1}}

</main>
<script>
  // Scale the 2376px artboard to the window width.
  const page = document.getElementById('page');
  const zoom = () => document.documentElement.clientWidth / 2376;
  const fit = () => page.style.setProperty('--zoom', zoom());
  fit();
  addEventListener('resize', fit);

  // Drive Away — continuous card slider with a progress line, plus three layout views.
  (() => {
    const panel = document.querySelector('.stock-panel');
    const viewport = panel.querySelector('.stock-viewport');
    const track = panel.querySelector('.stock-track');
    const bar = panel.querySelector('.stock-progress span');
    const originals = [...track.children];
    const SET_WIDTH = originals.length * (825.69 + 36.59); // one full lap, in artboard px
    const SPEED = 70;                                       // artboard px per second
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

    // A second copy of the cards makes the loop seamless.
    originals.forEach(card => {
      const copy = card.cloneNode(true);
      copy.classList.add('clone');
      copy.setAttribute('aria-hidden', 'true');
      copy.tabIndex = -1;
      track.append(copy);
    });

    let offset = 0, last = null, hovering = false, drag = null, moved = false;
    const isSlide = () => panel.dataset.view === 'slide';

    const render = () => {
      offset = ((offset % SET_WIDTH) + SET_WIDTH) % SET_WIDTH;
      track.style.transform = `translateX(${-offset}px)`;
      bar.style.transform = `scaleX(${offset / SET_WIDTH})`;
    };

    const tick = now => {
      if (isSlide()) {
        if (last !== null && !hovering && !drag && !reduced) offset += SPEED * (now - last) / 1000;
        render();
      }
      last = now;
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);

    viewport.addEventListener('pointerenter', () => hovering = true);
    viewport.addEventListener('pointerleave', () => hovering = false);
    viewport.addEventListener('focusin', () => hovering = true);
    viewport.addEventListener('focusout', () => hovering = false);

    // Drag to move the cards manually.
    viewport.addEventListener('pointerdown', e => {
      if (!isSlide() || e.button !== 0) return;
      drag = { x: e.clientX, start: offset }; moved = false;
    });
    addEventListener('pointermove', e => {
      if (!drag) return;
      const dx = (e.clientX - drag.x) / zoom();
      if (Math.abs(dx) > 4 && !moved) { moved = true; viewport.classList.add('dragging'); viewport.setPointerCapture?.(e.pointerId); }
      if (moved) offset = drag.start - dx;
    });
    addEventListener('pointerup', () => { drag = null; viewport.classList.remove('dragging'); });
    viewport.addEventListener('click', e => { if (moved) { e.preventDefault(); moved = false; } }, true);

    // Horizontal trackpad scroll also moves the cards; vertical scroll still scrolls the page.
    viewport.addEventListener('wheel', e => {
      if (!isSlide() || Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
      e.preventDefault();
      offset += e.deltaX / zoom();
    }, { passive: false });

    // View switcher.
    const buttons = document.querySelectorAll('.view-toggle button');
    buttons.forEach(btn => btn.addEventListener('click', () => {
      if (panel.dataset.view === btn.dataset.view) return;
      buttons.forEach(b => { b.classList.toggle('on', b === btn); b.setAttribute('aria-pressed', b === btn); });
      panel.dataset.view = btn.dataset.view;
      if (!isSlide()) track.style.transform = '';
      track.classList.remove('swap'); void track.offsetWidth; track.classList.add('swap');
    }));
    track.addEventListener('animationend', () => track.classList.remove('swap'));
  })();
  // Beyond Sale panels: hovering (or focusing) a panel opens it; it stays open until another is hovered.
  (() => {
    const items = [...document.querySelectorAll('.bs-item')];
    const open = el => items.forEach(i => i.classList.toggle('on', i === el));
    items.forEach(el => { el.addEventListener('mouseenter', () => open(el)); el.addEventListener('focus', () => open(el)); });
  })();

  // Ownership journey — while the stage is locked the page stays still and each scroll moves one step.
  (() => {
    const wrap = document.getElementById('journey');
    if (!wrap) return;
    const stage = document.getElementById('journey-stage');
    const after = document.getElementById('after-journey');
    const STAGE_H = 1564.77, CARE_HOLD = 3; // extra scrolls spent on "we care" before the next section
    const panels = [...stage.querySelectorAll('.step-panel')];
    const STEPS = panels.map(p => ({ path: p.dataset.path, x: +p.dataset.x, y: +p.dataset.y }));
    const CARE = STEPS.length, CUSTOM_LAST = STEPS.findIndex(s => s.path === 'stock') - 1;
    const diamonds = STEPS.map((_, k) => stage.querySelector(`.step-diamond[data-step="${k}"]`));
    const fills = { custom: stage.querySelector('.fill-custom'), stock: stage.querySelector('.fill-stock') };

    // Line length up to each diamond, so the white line stops exactly there.
    const lenAt = (path, x, y) => {
      let best = 0, bestD = Infinity;
      for (let l = 0, L = path.getTotalLength(); l <= L; l += 2) {
        const p = path.getPointAtLength(l), d = Math.hypot(p.x - x, p.y - y);
        if (d < bestD) { bestD = d; best = l; }
      }
      return best;
    };
    const stops = STEPS.map(s => lenAt(fills[s.path], s.x, s.y));
    Object.values(fills).forEach(f => { f.total = f.getTotalLength(); f.style.strokeDasharray = f.total; f.style.strokeDashoffset = f.total; });

    let state = 0;
    const render = () => {
      const k = Math.min(state, CARE - 1), phase = STEPS[k].path;
      stage.dataset.phase = phase;
      stage.classList.toggle('care', state === CARE);
      panels.forEach((p, i) => p.classList.toggle('on', i === k && state < CARE));
      diamonds.forEach((d, i) => d && d.classList.toggle('done', phase === 'stock' ? (STEPS[i].path === 'custom' || i <= k) : i <= k));
      fills.custom.style.strokeDashoffset = fills.custom.total - (phase === 'custom' ? stops[k] : (k === CARE - 1 ? fills.custom.total : stops[CUSTOM_LAST]));
      fills.stock.style.strokeDashoffset = fills.stock.total - (phase === 'stock' ? stops[k] : 0);
    };
    render();
    if (wrap.getBoundingClientRect().bottom > 0) after.classList.add('hidden'); // fades in once the journey is done

    let locked = false, hold = 0, busyUntil = 0, lastWheel = 0, cooldownUntil = 0, lastAbs = 0, lastStepAt = 0;
    // The stage always fills the window; its content scales to the window height and centres.
    const fit = () => {
      const vh = innerHeight / zoom(), s = Math.min(1, vh / STAGE_H);
      wrap.style.height = vh + 'px';
      stage.style.setProperty('--s', s);
      stage.style.setProperty('--tx', (2376 - 2376 * s) / 2 + 'px');
      stage.style.setProperty('--ty', (vh - STAGE_H * s) / 2 + 'px');
    };
    const alignTop = () => Math.max(0, (innerHeight - wrap.getBoundingClientRect().height) / 2); // centre the stage
    const snap = () => scrollTo({ top: scrollY + wrap.getBoundingClientRect().top - alignTop(), behavior: 'auto' });
    const lock = startState => {
      locked = true; document.documentElement.classList.add('scroll-locked');
      state = startState; hold = 0; snap(); render(); busyUntil = performance.now() + 250;
    };
    const unlock = () => { locked = false; document.documentElement.classList.remove('scroll-locked'); cooldownUntil = performance.now() + 700; };

    const exitDown = () => {
      // Fade "we care" out, then put Beyond Sale in place and fade it in instead of scrolling it up.
      busyUntil = performance.now() + 1900;
      stage.classList.add('leaving');
      setTimeout(() => {
        after.classList.add('hidden');
        void after.offsetWidth; // apply the hidden state first so the fade always plays (Safari)
        unlock();
        busyUntil = performance.now() + 1300;
        scrollTo({ top: scrollY + after.getBoundingClientRect().top, behavior: 'auto' });
        setTimeout(() => {
          after.classList.remove('hidden');
          stage.classList.remove('leaving');
        }, 30);
      }, 500);
    };
    const step = dir => {
      if (dir > 0) {
        if (state < CARE) { state++; render(); if (state === CARE) hold = 0; }
        else if (hold < CARE_HOLD) hold++;
        else exitDown();
      } else {
        if (state === CARE && hold > 0) hold--;
        else if (state > 0) { state--; render(); }
        else { unlock(); return; }
      }
      busyUntil = performance.now() + 420;
    };
    const onIntent = (dir, e, isNew) => {
      const now = performance.now();
      if (!locked) { if (now < busyUntil) e?.preventDefault(); return; } // swallow momentum after the fade-in
      if (dir < 0 && state === 0 && isNew && now >= busyUntil) { unlock(); return; } // release upward
      e?.preventDefault();
      if (isNew && now >= busyUntil) step(dir);
    };

    // One push of the wheel or trackpad is one scroll, wherever the cursor is. Momentum sends a stream of
    // events, so a new push is a pause OR the deltas growing again after fading out.
    document.addEventListener('wheel', e => {
      if (!e.deltaY || e.target.closest?.('.stock-viewport')) return;
      const now = performance.now(), abs = Math.abs(e.deltaY);
      const isNew = now - lastWheel > 120 || (abs > lastAbs * 1.5 && abs > 6 && now - lastStepAt > 260) || (abs > 25 && now - lastStepAt > 1100);
      lastWheel = now; lastAbs = abs;
      const before = state + hold;
      onIntent(Math.sign(e.deltaY), e, isNew);
      if (state + hold !== before) lastStepAt = now;
    }, { passive: false, capture: true });
    document.addEventListener('keydown', e => {
      if (e.target.closest('input, textarea, select')) return;
      const down = ['ArrowDown', 'PageDown'].includes(e.key) || (e.key === ' ' && !e.shiftKey);
      const up = ['ArrowUp', 'PageUp'].includes(e.key) || (e.key === ' ' && e.shiftKey);
      if (down || up) onIntent(down ? 1 : -1, e, true);
    }, { capture: true });

    // Scrolling back up from Beyond Sale fades it out and fades "we care" back in, rather than scrolling.
    const fadeBack = () => {
      document.documentElement.classList.add('scroll-locked'); // stop the upward scroll where it is
      scrollTo({ top: scrollY + wrap.getBoundingClientRect().bottom, behavior: 'auto' });
      busyUntil = performance.now() + 1100;
      after.classList.add('fading-out');
      setTimeout(() => {
        stage.classList.add('leaving');
        void stage.offsetWidth;
        lock(CARE);
        busyUntil = performance.now() + 600;
        setTimeout(() => {
          stage.classList.remove('leaving');
          after.classList.remove('fading-out');
        }, 30);
      }, 500);
    };

    // Engage the lock when the stage reaches its place, from either direction.
    let prevTop = wrap.getBoundingClientRect().top, prevBottom = wrap.getBoundingClientRect().bottom;
    const watch = () => {
      const r = wrap.getBoundingClientRect(), target = alignTop();
      if (!locked && performance.now() > cooldownUntil && performance.now() > busyUntil && prevBottom <= 1 && r.bottom > 1 && r.bottom < innerHeight) {
        fadeBack();
        prevTop = r.top; prevBottom = r.bottom;
        return;
      }
      if (!locked && performance.now() > cooldownUntil) {
        if (prevTop > target && r.top <= target && r.top > -r.height) lock(0);
        else if (prevTop < target && r.top >= target && r.top < innerHeight) lock(CARE);
      }
      if (!locked && r.bottom <= 0) after.classList.remove('hidden'); // reached some other way
      prevTop = wrap.getBoundingClientRect().top;
      prevBottom = wrap.getBoundingClientRect().bottom;
    };
    addEventListener('scroll', watch, { passive: true });
    const loop = () => { watch(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
    addEventListener('resize', () => { fit(); if (locked) snap(); });
    fit();
  })();
</script>
</body>
</html>
